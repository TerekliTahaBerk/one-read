name: Mobile quality (postponed)

# Mobile is retained as historical/future work, but is intentionally separate
# from the OneArticle production merge gate.
on:
  workflow_dispatch:
  push:
    paths: ["mobile-app/**", ".github/workflows/mobile-quality.yml"]

permissions:
  contents: read

jobs:
  mobile:
    name: Mobile quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx expo-doctor
