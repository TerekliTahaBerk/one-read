name: Production release

# Audits the two halves of a release after Vercel promotion. The production
# build itself runs scripts/guard-production-database.mjs before `next build`,
# so committed migrations are applied before a new Prisma client can go live.
# This workflow independently verifies both artifact provenance and migration
# state at the exact commit Vercel reports as deployed.
#
# Migrations must remain forward-compatible — expand first, contract in a later
# release — because the previous production artifact keeps serving traffic
# while the new artifact is built.
#
# Required repository secrets:
#   VERCEL_TOKEN          — read access for the provenance audit
#   PRISMA_DATABASE_URL   — production database used for the independent state
#                           check; absence fails the release audit
# Required repository variable:
#   VERCEL_SCOPE          — the Vercel team slug (tereklitahaberks-projects)

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      deployment:
        description: "Vercel deployment URL to audit (defaults to whatever the production domain serves)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    name: Verify provenance, then migrate
    # Only a *successful production* deployment is a release. Preview
    # deployments and in-flight states are ignored.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       (github.event.deployment.environment == 'Production' ||
        github.event.deployment.environment == 'production'))
    runs-on: ubuntu-latest

    steps:
      - name: Check out the deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Pinned deliberately: the audit parses `vercel list --format json`, and
      # that shape is a CLI implementation detail. Re-check the output before
      # bumping this version.
      - name: Install Vercel CLI
        run: npm install --global vercel@54.4.1

      - name: Verify release provenance
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
          RELEASE_GITHUB_TOKEN: ${{ github.token }}
          # Read through an env var rather than interpolated into the script:
          # target_url is supplied by the deployment provider.
          TARGET_URL: ${{ github.event.deployment_status.target_url || inputs.deployment }}
        run: |
          if [ -n "$TARGET_URL" ]; then
            npm run release:verify -- --deployment "$TARGET_URL"
          else
            npm run release:verify
          fi

      - name: Verify production migration state
        env:
          PRISMA_DATABASE_URL: ${{ secrets.PRISMA_DATABASE_URL }}
          RELEASE_SHA: ${{ github.event.deployment.sha || github.sha }}
        run: |
          if [ -z "$PRISMA_DATABASE_URL" ]; then
            echo "::error::PRISMA_DATABASE_URL is not configured — production migration state cannot be verified for $RELEASE_SHA."
            echo "- ❌ Migration state unavailable: no \`PRISMA_DATABASE_URL\` secret" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "Verifying migrations for $RELEASE_SHA"
          npx prisma migrate status

          echo "- ✅ Migration state clean for \`$RELEASE_SHA\`" >> "$GITHUB_STEP_SUMMARY"
